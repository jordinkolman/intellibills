services:
  db:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: intellibills_db
    env_file:
      - .env
    command: ["postgres", "-c", "shared_preload_libraries=pgaudit"]
    ports:
      - "5432:5432"
    volumes:
      # Named volume for persistent database data
      - pg_data:/var/lib/postgresql/data
      # Bind mounts for initialization scripts
      - ./db/docker_db_files/00_roles.sh:/docker-entrypoint-initdb.d/00_roles.sh:ro
      - ./db/docker_db_files/05_create_db.sql:/docker-entrypoint-initdb.d/05_create_db.sql:ro
    restart: unless-stopped

volumes:
  pg_data:
