services:
  db:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: intellibills_db
    env_file:
      - .env
    command: ["postgres", "-c", "shared_preload_libraries=pgaudit"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume for persistent database data
      - pg_data:/var/lib/postgresql/data
      # Bind mounts for initialization scripts
      - ./db/docker_db_files/db_config.sh:/docker-entrypoint-initdb.d/db_config.sh:ro
      # Bind mount for pgTAP tests
      - ./db/tests:/tests:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-intellibills}"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    image: migrate/migrate
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./db/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://app_admin:${APP_ADMIN_PASSWORD_URLENC}@db:5432/${POSTGRES_DB:-intellibills}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg_data:
